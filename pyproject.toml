[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feagle"
# Single source of truth: src/feagle/__init__.py (see [tool.hatch.version]).
dynamic = ["version"]
description = "Local semantic file search for Arch Linux + Wayland: full-text and meaning-based lookup, fully offline."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "microwavedKing" }]
keywords = ["search", "semantic", "embeddings", "fts5", "sqlite", "wayland", "archlinux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "watchfiles>=1.2",
  "httpx>=0.27",
  "sqlite-vec>=0.1.6",
  "snowballstemmer>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[project.scripts]
feagle = "feagle.cli.__main__:main"

[project.urls]
Homepage = "https://github.com/microwavedKing/feagle"
Repository = "https://github.com/microwavedKing/feagle"

[tool.hatch.version]
path = "src/feagle/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/feagle"]

[tool.hatch.build]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.pyo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "F", "W",   # pycodestyle / pyflakes
  "I",             # import sorting
  "UP",            # pyupgrade
  "B", "BLE",      # bugbear / blind except
  "SIM",           # simplify
  "RUF", "PERF",   # ruff-specific / performance
  "RET", "TCH",    # return statements / type-checking imports
]
ignore = [
  # Ambiguous unicode (Russian text, typographic quotes/dashes) is intentional.
  "RUF001", "RUF002", "RUF003",
]

[tool.coverage.run]
source = ["src/feagle"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.mypy]
python_version = "3.12"
files = ["src/feagle", "scripts"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# These dependencies ship no type information (no py.typed).
[[tool.mypy.overrides]]
module = ["snowballstemmer", "sqlite_vec"]
ignore_missing_imports = true
