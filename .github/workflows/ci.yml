name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # Tests that need llama-server, a model, poppler or tesseract skip
        # themselves; nothing here needs network or a GUI. Coverage is a gate
        # (branch coverage, currently ~85%).
        run: pytest -q --cov=feagle --cov-report=term-missing --cov-fail-under=84

      - name: CLI smoke test
        run: |
          feagle --version
          feagle doctor --fast || true
